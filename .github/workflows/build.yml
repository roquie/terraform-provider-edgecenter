name: Credential-free CI

on:
  push:
    branches:
      - ci/patched-provider-releases
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TF_ACC: ''
  GOTELEMETRY: 'off'
  GOENV: 'off'
  GOTOOLCHAIN: go1.26.8
  GOSUMDB: sum.golang.org
  GOPROXY: https://proxy.golang.org,direct
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          check-latest: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=20m ./...

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -I scripts/test_release.py

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          check-latest: false
      - name: Build all six platforms
        env:
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.16.99-patch4.19700101.1' }}
        run: python3 -I scripts/release.py build --version "${BUILD_TAG#v}" --directory "$RUNNER_TEMP/provider-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-release-${{ github.sha }}
          path: ${{ runner.temp }}/provider-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
