name: Patched provider release

on:
  push:
    tags:
      - v0.16.99-patch4.*

permissions:
  contents: read

concurrency:
  group: provider-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and required fixes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I scripts/release.py check-tag --version "${RELEASE_TAG#v}"

  ci:
    needs: source
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: provider-release-${{ github.sha }}
          path: ${{ runner.temp }}/provider-release
      - name: Publish a complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I scripts/release.py publish --version "${RELEASE_TAG#v}" --directory "$RUNNER_TEMP/provider-release"
